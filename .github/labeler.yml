# Area labels added to pull requests by .github/workflows/labeler.yml. Not part of an app made from the
# template. Never add "native" here: that label starts the native CI builds (ADR 0014), so it stays manual.

'area: app':
  - changed-files:
      - any-glob-to-any-file: ['src/**', 'index.js', 'index.demo.js']

'area: native':
  - changed-files:
      - any-glob-to-any-file: ['ios/**', 'android/**', 'fastlane/**', 'Gemfile', 'Gemfile.lock']

'area: installer':
  - changed-files:
      - any-glob-to-any-file: ['packages/**', 'scripts/pack-template.ts', 'scripts/bootstrap.ts']

'area: site':
  - changed-files:
      - any-glob-to-any-file: ['website/**']

'area: docs':
  - changed-files:
      - any-glob-to-any-file: ['docs/**', '*.md']

'area: deps':
  - changed-files:
      - any-glob-to-any-file:
          ['package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'renovate.json']

'area: ci':
  - changed-files:
      - any-glob-to-any-file: ['.github/**', 'scripts/ci/**']
