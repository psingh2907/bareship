# Labels each pull request by the areas it touches (.github/labeler.yml), so the list of open pull requests
# and the release notes (.github/release.yml) sort themselves. Not part of an app made from the template.
#
# pull_request_target so it can label pull requests from forks too. It never checks out or runs their code:
# the labeler only reads the list of changed files through the API.
name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label by area
    if: github.repository == 'psingh2907/bareship'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@v7
        with:
          sync-labels: true
